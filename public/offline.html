<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오프라인 | 내 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101a28; color: #ecf4ff; }
    main { max-width: 520px; padding: 24px; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
  </style>
</head>
<body>
  <main>
    <h1>지금은 인터넷에 연결되어 있지 않습니다</h1>
    <p>내 자료실의 메모는 이 기기에 저장해 두지 않습니다. 연결이 돌아오면 다시 열어 로그인해 주세요.</p>
    <p>앱을 설치했다는 표시만으로는 기기를 믿지 않습니다. 기기 승인은 서버가 확인합니다.</p>
  </main>
</body>
</html>
