<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 점령된 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; white-space: pre-wrap; }
    .auth { margin: 26px 0; padding: 18px; border: 1px solid #51667c; border-radius: 14px; background: #1a2a3d; }
    .auth h2 { margin: 0 0 12px; font-size: 18px; }
    form { display: grid; gap: 10px; }
    label { display: grid; gap: 4px; font-size: 14px; color: #bfd0e5; }
    input, textarea { padding: 10px 12px; border: 1px solid #51667c; border-radius: 10px; background: #101a28; color: #ecf4ff; font-size: 16px; font-family: inherit; }
    textarea { min-height: 80px; resize: vertical; }
    button { padding: 10px 14px; border: 0; border-radius: 10px; background: #8ad8df; color: #101a28; font-size: 16px; font-weight: 700; cursor: pointer; }
    button.secondary { background: #3a5068; color: #ecf4ff; }
    button.danger { background: #d07384; color: #101a28; }
    button:disabled { opacity: .6; cursor: wait; }
    .row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .error { margin: 10px 0 0; font-size: 15px; color: #ffb3c0; }
    .who { margin: 0 0 12px; font-size: 16px; }
    .composer { margin: 0 0 18px; padding: 18px; border: 1px solid #51667c; border-radius: 14px; background: #1a2a3d; }
    .composer h2 { margin: 0 0 12px; font-size: 18px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 3단계 로그인</div>
    <h1>점령된 자료실</h1>
    <p>아래 기록은 모두 실습을 위해 만든 가상 자료입니다. 실제 개인정보를 넣지 마세요.</p>
    <div class="notice">로그인한 사용자만 메모를 읽고 쓸 수 있고, 서버가 로그인한 사용자와 메모 소유자를 비교해 내 메모만 허용합니다.</div>
    <section class="auth" aria-labelledby="auth-title">
      <h2 id="auth-title">로그인</h2>
      <form id="login-form">
        <label>이메일
          <input id="email" type="email" autocomplete="email" required>
        </label>
        <label>비밀번호
          <input id="password" type="password" autocomplete="current-password" required>
        </label>
        <button id="login-button" type="submit">로그인</button>
      </form>
      <div id="signed-in" hidden>
        <p class="who">로그인한 계정: <strong id="account-email"></strong></p>
        <button id="logout-button" type="button">로그아웃</button>
      </div>
      <p id="auth-error" class="error" role="alert" hidden></p>
    </section>
    <section id="composer" class="composer" hidden aria-labelledby="composer-title">
      <h2 id="composer-title">메모 추가</h2>
      <form id="add-form">
        <label>제목
          <input id="add-title" type="text" maxlength="200" required>
        </label>
        <label>본문
          <textarea id="add-body" maxlength="5000"></textarea>
        </label>
        <button id="add-button" type="submit">추가</button>
      </form>
    </section>
    <p id="notes-error" class="error" role="alert" hidden></p>
    <ul id="notes" aria-live="polite"><li>로그인하면 내 가상 메모가 보입니다.</li></ul>
  </main>
  <script type="module">
    // 로그인·로그아웃은 서버 함수(/api/login, /api/logout)가 대신한다.
    // 이 파일은 인증 서비스의 주소도 키도 모른다. 서버가 돌려준 토큰만 이 탭에 보관한다.
    const SESSION_KEY = 'vault-session';
    const $ = selector => document.querySelector(selector);
    const form = $('#login-form');
    const signedIn = $('#signed-in');
    const authError = $('#auth-error');
    const notesError = $('#notes-error');
    const loginButton = $('#login-button');
    const list = $('#notes');
    const setError = (element, message) => {
      element.textContent = message;
      element.hidden = !message;
    };

    const readSession = () => {
      try {
        const saved = JSON.parse(sessionStorage.getItem(SESSION_KEY));
        if (saved?.access_token && saved.expires_at * 1000 > Date.now()) return saved;
      } catch {
        // 저장소를 읽지 못하면 로그아웃 상태로 본다.
      }
      return null;
    };
    const writeSession = next => {
      try {
        if (next) sessionStorage.setItem(SESSION_KEY, JSON.stringify(next));
        else sessionStorage.removeItem(SESSION_KEY);
      } catch {
        // 저장하지 못해도 새로고침하면 로그아웃되는 정도다.
      }
    };

    let session = null;
    // 서버가 토큰을 검증한다. 화면은 로그인 상태를 보여 줄 뿐 권한을 판단하지 않는다.
    const api = async (path, options = {}) => {
      const response = await fetch(path, {
        cache: 'no-store',
        ...options,
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session?.access_token}` },
      });
      const data = await response.json().catch(() => null);
      if (response.status === 401) {
        showSession(null);
        setError(authError, '로그인이 만료되었거나 필요합니다. 다시 로그인해 주세요.');
        throw new Error('로그인이 필요합니다 (401)');
      }
      if (!response.ok) throw new Error(`요청이 거부되었습니다 (${response.status})`);
      return data;
    };
    // 로그인이 풀린 뒤에는 오류를 목록 쪽에 따로 띄우지 않는다.
    const fail = (prefix, error) => {
      if (session) setError(notesError, `${prefix}: ${error.message}`);
    };

    const renderEmpty = text => {
      const item = document.createElement('li');
      item.textContent = text;
      list.replaceChildren(item);
    };

    const renderNote = note => {
      const item = document.createElement('li');
      const show = () => {
        const title = document.createElement('strong');
        const body = document.createElement('span');
        title.textContent = note.title;
        body.textContent = note.body;
        const row = document.createElement('div');
        row.className = 'row';
        const edit = document.createElement('button');
        edit.type = 'button'; edit.className = 'secondary'; edit.textContent = '수정';
        edit.addEventListener('click', editMode);
        const remove = document.createElement('button');
        remove.type = 'button'; remove.className = 'danger'; remove.textContent = '삭제';
        remove.addEventListener('click', async () => {
          setError(notesError, '');
          remove.disabled = true;
          try {
            await api(`/api/notes/${note.id}`, { method: 'DELETE' });
            await loadNotes();
          } catch (error) {
            remove.disabled = false;
            fail('삭제 실패', error);
          }
        });
        row.append(edit, remove);
        item.replaceChildren(title, body, row);
      };
      const editMode = () => {
        const editor = document.createElement('form');
        const title = document.createElement('input');
        title.value = note.title; title.maxLength = 200; title.required = true;
        const body = document.createElement('textarea');
        body.value = note.body; body.maxLength = 5000;
        const row = document.createElement('div');
        row.className = 'row';
        const save = document.createElement('button');
        save.type = 'submit'; save.textContent = '저장';
        const cancel = document.createElement('button');
        cancel.type = 'button'; cancel.className = 'secondary'; cancel.textContent = '취소';
        cancel.addEventListener('click', show);
        row.append(save, cancel);
        editor.append(title, body, row);
        editor.addEventListener('submit', async event => {
          event.preventDefault();
          setError(notesError, '');
          save.disabled = true;
          try {
            const updated = await api(`/api/notes/${note.id}`, {
              method: 'PUT', body: JSON.stringify({ title: title.value, body: body.value }),
            });
            note = updated;
            show();
          } catch (error) {
            save.disabled = false;
            fail('수정 실패', error);
          }
        });
        item.replaceChildren(editor);
      };
      show();
      return item;
    };

    async function loadNotes() {
      setError(notesError, '');
      try {
        const notes = await api('/api/notes');
        if (!Array.isArray(notes)) throw new Error('자료 형식이 맞지 않습니다.');
        if (!notes.length) return renderEmpty('아직 메모가 없습니다. 위에서 추가해 보세요.');
        list.replaceChildren(...notes.map(renderNote));
      } catch (error) {
        if (session) renderEmpty(error.message);
      }
    }

    const showSession = next => {
      session = next;
      writeSession(next);
      form.hidden = Boolean(next);
      signedIn.hidden = !next;
      $('#composer').hidden = !next;
      $('#auth-title').textContent = next ? '로그인됨' : '로그인';
      $('#account-email').textContent = next?.email ?? '';
      if (next) {
        loadNotes();
      } else {
        setError(notesError, '');
        renderEmpty('로그인하면 내 가상 메모가 보입니다.');
      }
    };

    form.addEventListener('submit', async event => {
      event.preventDefault();
      setError(authError, '');
      loginButton.disabled = true;
      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          cache: 'no-store',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: $('#email').value.trim(), password: $('#password').value }),
        });
        const data = await response.json().catch(() => null);
        $('#password').value = '';
        if (!response.ok || !data?.access_token) {
          setError(authError, `로그인 실패: ${data?.message ?? `요청이 거부되었습니다 (${response.status})`}`);
          return;
        }
        showSession({ access_token: data.access_token, expires_at: data.expires_at, email: data.email });
      } catch {
        setError(authError, '로그인 실패: 서버에 연결하지 못했습니다.');
      } finally {
        loginButton.disabled = false;
      }
    });

    $('#logout-button').addEventListener('click', async () => {
      setError(authError, '');
      const token = session?.access_token;
      showSession(null);
      if (!token) return;
      try {
        await fetch('/api/logout', {
          method: 'POST', cache: 'no-store', headers: { Authorization: `Bearer ${token}` },
        });
      } catch {
        // 서버에서 끊지 못해도 이 탭의 로그인은 이미 지웠다.
      }
    });

    $('#add-form').addEventListener('submit', async event => {
      event.preventDefault();
      setError(notesError, '');
      const button = $('#add-button');
      button.disabled = true;
      try {
        // id를 비우면 서버가 만들어 {id}로 돌려준다.
        await api('/api/notes', {
          method: 'POST', body: JSON.stringify({ title: $('#add-title').value, body: $('#add-body').value }),
        });
        $('#add-title').value = '';
        $('#add-body').value = '';
        await loadNotes();
      } catch (error) {
        fail('추가 실패', error);
      } finally {
        button.disabled = false;
      }
    });

    showSession(readSession());
  </script>
</body>
</html>
