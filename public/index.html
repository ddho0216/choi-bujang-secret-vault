<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 점령된 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; }
    .auth { margin: 26px 0; padding: 18px; border: 1px solid #51667c; border-radius: 14px; background: #1a2a3d; }
    .auth h2 { margin: 0 0 12px; font-size: 18px; }
    .auth form { display: grid; gap: 10px; }
    .auth label { display: grid; gap: 4px; font-size: 14px; color: #bfd0e5; }
    .auth input { padding: 10px 12px; border: 1px solid #51667c; border-radius: 10px; background: #101a28; color: #ecf4ff; font-size: 16px; }
    .auth button { padding: 10px 14px; border: 0; border-radius: 10px; background: #8ad8df; color: #101a28; font-size: 16px; font-weight: 700; cursor: pointer; }
    .auth button:disabled { opacity: .6; cursor: wait; }
    .auth .error { margin: 10px 0 0; font-size: 15px; color: #ffb3c0; }
    .auth .who { margin: 0 0 12px; font-size: 16px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 3단계 로그인</div>
    <h1>점령된 자료실</h1>
    <p>지금은 보호 장치가 없는 상태입니다. 아래 기록은 모두 실습을 위해 만든 가상 자료입니다.</p>
    <div class="notice">로그인하지 않은 방문자도 자료를 볼 수 있습니다. 공개 범위를 확인하고, 다음 제작 단계에서 접근을 차례로 막아 주세요.</div>
    <section class="auth" aria-labelledby="auth-title">
      <h2 id="auth-title">로그인</h2>
      <form id="login-form">
        <label>이메일
          <input id="email" type="email" autocomplete="email" required>
        </label>
        <label>비밀번호
          <input id="password" type="password" autocomplete="current-password" required>
        </label>
        <button id="login-button" type="submit">로그인</button>
      </form>
      <div id="signed-in" hidden>
        <p class="who">로그인한 계정: <strong id="account-email"></strong></p>
        <button id="logout-button" type="button">로그아웃</button>
      </div>
      <p id="auth-error" class="error" role="alert" hidden></p>
    </section>
    <ul id="notes" aria-live="polite"><li>가상 자료를 불러오는 중입니다.</li></ul>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"
    integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok"
    crossorigin="anonymous"></script>
  <script type="module">
    // 로그인: Supabase 공식 SDK만 사용한다. 아래 두 값은 공개용(Project URL, publishable key)이다.
    // 서버 전용 secret 키는 이 파일에 넣지 않는다.
    const SUPABASE_URL = 'https://meupslbrbesjtyuwpske.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_eTa8b4uziI31qAh_rSmyLA_t_CpLlo3';
    const form = document.querySelector('#login-form');
    const signedIn = document.querySelector('#signed-in');
    const authError = document.querySelector('#auth-error');
    const loginButton = document.querySelector('#login-button');
    const showError = message => {
      authError.textContent = message;
      authError.hidden = !message;
    };
    const showSession = session => {
      const email = session?.user?.email;
      form.hidden = Boolean(session);
      signedIn.hidden = !session;
      document.querySelector('#auth-title').textContent = session ? '로그인됨' : '로그인';
      document.querySelector('#account-email').textContent = email ?? '';
    };
    if (!window.supabase) {
      showError('로그인 라이브러리를 불러오지 못했습니다. 새로고침해 주세요.');
      loginButton.disabled = true;
    } else {
      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
      supabase.auth.onAuthStateChange((_event, session) => showSession(session));
      const { data } = await supabase.auth.getSession();
      showSession(data.session);
      form.addEventListener('submit', async event => {
        event.preventDefault();
        showError('');
        loginButton.disabled = true;
        const { error } = await supabase.auth.signInWithPassword({
          email: document.querySelector('#email').value.trim(),
          password: document.querySelector('#password').value,
        });
        loginButton.disabled = false;
        document.querySelector('#password').value = '';
        if (error) showError(`로그인 실패: ${error.message}`);
      });
      document.querySelector('#logout-button').addEventListener('click', async () => {
        showError('');
        const { error } = await supabase.auth.signOut();
        if (error) showError(`로그아웃 실패: ${error.message}`);
      });
    }

    const list = document.querySelector('#notes');
    try {
      const response = await fetch('/api/notes', { cache: 'no-store' });
      if (!response.ok) throw new Error('자료를 읽을 수 없습니다.');
      const data = await response.json();
      if (!Array.isArray(data.notes)) throw new Error('자료 형식이 맞지 않습니다.');
      list.replaceChildren(...data.notes.map(note => {
        const item = document.createElement('li');
        const title = document.createElement('strong');
        const content = document.createElement('span');
        title.textContent = note.title;
        content.textContent = note.content;
        item.append(title, content);
        return item;
      }));
    } catch (error) {
      const item = document.createElement('li');
      item.textContent = error.message;
      list.replaceChildren(item);
    }
  </script>
</body>
</html>
